server:
  port: 8081
spring:
  application:
    name: admin-service
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# 阿里云OSS配置：accessKey从环境变量读取
oss:
  endpoint: https://oss-cn-beijing.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: novae-oss
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #mybatis官方提供的控制台打印日志
  type-aliases-package: cn.tinsur.mall.pojo,cn.tinsur.mall.admin.pojo
  global-config:
    db-config:
      logic-delete-field: deleted
  #   logic-delete-value: 1 # 逻辑已删除值(默认为 1)
  #   logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)