server:
  port: 9000 # 前端默认访问端口号为9000
  servlet:
    context-path: / # 前端默认访问的根路径
spring:
  application:
    name: gateway-service  # 程序名就是服务名
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
    gateway: # predicates断言  Path路径断言
      routes:
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/admin/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/product/**
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/category/**
        - id: service-service
          uri: lb://service-service
          predicates:
            - Path=/service/**
        - id: user-service  #
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: order-service  #
          uri: lb://order-service
          predicates:
            - Path=/order/**
        - id: cart-service  #
          uri: lb://cart-service
          predicates:
            - Path=/cart/**
        - id: shipping-service  #
          uri: lb://shipping-service
          predicates:
            - Path=/shipping/**