server:
  port: 8082
spring:
  application:
    name: product-service
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #mybatis官方提供的控制台打印日志
  type-aliases-package: cn.tinsur.mall.pojo
  global-config:
    db-config:
      logic-delete-field: deleted
  #   logic-delete-value: 1 # 逻辑已删除值(默认为 1)
  #   logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
